<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
  width: 300px;
  padding: 16px;
  font-family: -apple-system, "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: #333;
}
h1 {
  font-size: 16px;
  margin: 0 0 12px 0;
  text-align: center;
}
#exportBtn {
  display: block;
  width: 100%;
  padding: 12px;
  font-size: 15px;
  background: #e74c3c;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
#exportBtn:hover {
  background: #c0392b;
}
#exportBtn:disabled {
  background: #bbb;
  cursor: not-allowed;
}
#status {
  margin-top: 12px;
  min-height: 20px;
  text-align: center;
  color: #666;
}
</style>
</head>
<body>
  <h1>天天象棋棋谱导出</h1>
  <button id="exportBtn">导出全部对局</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
